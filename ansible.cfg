[defaults]
# Your own cabinets, ignored by git (just init copies examples/inventory/).
inventory = inventory/inventory.yml
host_key_checking = True
result_format = yaml
interpreter_python = /usr/bin/python3
# Collections of requirements.yml, installed by just setup next to the project (git-ignored),
# so a system-wide Ansible or another project's collections never get in the way.
collections_path = .ansible/collections

[privilege_escalation]
# The cabinet user has no general sudo rights (least privilege): root is reached with su,
# so every run prompts for the root password (-K).
# Overridden per group where root is locked (group_vars/raspberry_pi.yml).
become_method = su
